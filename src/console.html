<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anima 控制台</title>
<style>
:root {
  --bg: #0D0D1A; --sidebar: #141425; --border: #2A2A45;
  --text: #FFF8DC; --muted: #C0C0C0; --accent: #FFD700;
  --surface: #1A1A2E; --hover: rgba(255,255,255,.06);
  --xi: #7B9CC2; --yiyi: #E8A87C; --tianyuan: #6B9080;
  --success: #4CAF50; --warn: #FFA726; --error: #EF5350;
  --radius: 10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; font-size:14px; line-height:1.5; }

/* 侧边栏 */
.sidebar { width:220px; min-width:220px; background:var(--sidebar); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
.sidebar-header { padding:20px 16px 16px; border-bottom:1px solid var(--border); }
.sidebar-header h2 { font-size:17px; color:var(--accent); font-weight:700; }
.sidebar-header p { font-size:11px; color:var(--muted); margin-top:4px; }
.sidebar-nav { flex:1; padding:8px; }
.nav-section { font-size:10px; color:var(--muted); padding:16px 12px 6px; text-transform:uppercase; letter-spacing:1.5px; font-weight:600; }
.nav-item { padding:10px 12px; border-radius:var(--radius); cursor:pointer; color:var(--muted); margin-bottom:2px; transition:all .15s; font-size:13px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.nav-item:hover { background:var(--hover); color:var(--text); }
.nav-item.active { background:rgba(255,215,0,.12); color:var(--accent); font-weight:600; }

/* 主区域 */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.topbar { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; background:var(--sidebar); flex-shrink:0; }
.topbar h1 { font-size:18px; font-weight:700; white-space:nowrap; }
.topbar .links { margin-left:auto; display:flex; gap:8px; flex-shrink:0; }
.topbar .links a { color:var(--accent); text-decoration:none; font-size:12px; padding:7px 14px; border:1px solid var(--border); border-radius:var(--radius); white-space:nowrap; transition:all .15s; }
.topbar .links a:hover { background:var(--hover); border-color:var(--accent); }

/* 内容网格 */
.content { flex:1; overflow-y:auto; padding:24px; display:flex; flex-wrap:wrap; gap:16px; }
.content > .card { flex:1 1 320px; min-width:280px; max-width:1fr; }

/* 卡片 */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; }
.card h3 { font-size:12px; color:var(--muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600; display:flex; align-items:center; gap:6px; }
.card .big { font-size:30px; font-weight:700; line-height:1.2; }
.card .sub { font-size:12px; color:var(--muted); margin-top:6px; }
.card-full { flex:1 1 100%; min-width:100%; }

/* Worker */
.worker-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
.worker-row:last-child { border-bottom:none; }
.worker-name { display:flex; align-items:center; gap:8px; }
.worker-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.worker-dot.online { background:var(--success); }
.worker-dot.busy { background:var(--warn); animation:pulse 1.2s infinite; }
.worker-dot.offline { background:var(--muted); }
.worker-status { font-size:11px; color:var(--muted); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

/* API条 */
.api-bar-wrap { margin:8px 0; }
.api-bar-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }
.api-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.api-fill { height:100%; border-radius:3px; transition:width .8s ease; }
.api-fill.safe { background:var(--success); }
.api-fill.warn { background:var(--warn); }
.api-fill.danger { background:var(--error); }

/* 按钮 */
.quick-btn { display:block; width:100%; padding:9px 14px; margin-bottom:6px; background:var(--hover); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; text-align:left; font-size:13px; color:var(--text); transition:all .15s; font-family:inherit; }
.quick-btn:last-child { margin-bottom:0; }
.quick-btn:hover { background:rgba(255,215,0,.08); border-color:var(--accent); }

/* 趋势条 */
.trend-row { display:flex; align-items:center; gap:10px; margin:5px 0; }
.trend-date { font-size:11px; color:var(--muted); width:42px; text-align:right; font-variant-numeric:tabular-nums; }
.trend-bar-wrap { flex:1; height:5px; background:var(--border); border-radius:3px; overflow:hidden; }
.trend-bar { height:100%; border-radius:3px; transition:width .5s; min-width:3px; }
.trend-val { font-size:11px; color:var(--muted); width:38px; text-align:right; font-variant-numeric:tabular-nums; }

.loading { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; grid-column:1/-1; }

/* 滚动条 */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--muted); }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h2>Anima 控制台</h2>
    <p>Anima Console</p>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">员工</div>
    <div class="nav-item active" data-agent="xi" onclick="switchAgent('xi',this)">🤖 Anima</div>
    <div class="nav-item" data-agent="yiyi" onclick="switchAgent('yiyi',this)">🌸 情感通道</div>
    <div class="nav-item" data-agent="tianyuan" onclick="switchAgent('tianyuan',this)">🏢 任务通道</div>
    <div class="nav-section">功能</div>
    <div class="nav-item" onclick="window.open('http://127.0.0.1:9119')">📊 Dashboard</div>
    <div class="nav-item" onclick="window.open('http://127.0.0.1:9119/kanban')">📋 Kanban</div>
    <div class="nav-item" onclick="refresh()">🔄 刷新</div>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h1 id="pageTitle">🤖 Anima</h1>
    <div class="links">
      <a href="http://127.0.0.1:9119" target="_blank">Dashboard →</a>
      <a href="#" onclick="refresh();return false">刷新</a>
    </div>
  </div>
  <div class="content" id="content">
    <div class="loading">加载中…</div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:9100';
let agent = 'xi';

const EMPLOYEES = {
  xi:  { name:'Anima', icon:'🤖', title:'私人助理', color:'#7B9CC2', ws:'/ws/xi', quota:1000 },
  yiyi:    { name:'情感通道', icon:'🌸', title:'情感支持', color:'#E8A87C', ws:'/ws/yiyi', quota:200 },
  tianyuan:{ name:'任务通道', icon:'🏢', title:'任务编排', color:'#6B9080', ws:'/ws/tianyuan', quota:800 },
};

function switchAgent(id, el) {
  agent = id;
  document.querySelectorAll('.nav-item[data-agent]').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  document.getElementById('pageTitle').innerHTML = `${EMPLOYEES[id].icon} ${EMPLOYEES[id].name}`;
  document.title = `${EMPLOYEES[id].name} · Anima`;
  refresh();
}

async function refresh() {
  document.getElementById('content').innerHTML = '<div class="loading">加载中…</div>';
  const emp = EMPLOYEES[agent];

  try {
    const uResp = await fetch(`${API}/usage?days=7`);
    const usage = await uResp.json();

    const ws = new WebSocket(`ws://127.0.0.1:9100${emp.ws}`);
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'response') render(usage, m.data || {});
      ws.close();
    };
    ws.onopen = () => ws.send(JSON.stringify({action:'status'}));
    ws.onerror = () => render(usage, { agent:emp.name, model:'-', tools:0, busy:false });
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="card card-full" style="text-align:center"><h3>⚠️ 无法连接后端</h3><p style="color:var(--muted);margin-top:8px">请运行 websocket_server.py</p></div>';
  }
}

function render(usage, status) {
  const emp = EMPLOYEES[agent];
  const daysCount = usage.daily?.length || 7;
  const projCost = usage.total_cost > 0 ? (usage.total_cost / Math.max(daysCount,1) * 30).toFixed(1) : '0';
  const pct = Math.min(100, (usage.total_cost / emp.quota * 100)).toFixed(0);
  const barClass = pct > 80 ? 'danger' : pct > 50 ? 'warn' : 'safe';

  document.getElementById('content').innerHTML = `
    <div class="card">
      <h3>${emp.icon} 状态</h3>
      <div class="big" style="color:${emp.color}">${status.busy ? '⚡ 工作中' : '✅ 就绪'}</div>
      <div class="sub">模型 ${status.model||'-'} · ${status.tools||0} 工具</div>
    </div>

    <div class="card">
      <h3>💰 API 用量</h3>
      <div class="big">¥${usage.total_cost.toFixed(2)}</div>
      <div class="sub">预估月费 ¥${projCost} / 配额 ¥${emp.quota}</div>
      <div class="api-bar-wrap">
        <div class="api-bar"><div class="api-fill ${barClass}" style="width:${pct}%"></div></div>
      </div>
      <div class="sub">${(usage.total_tokens||0).toLocaleString()} tokens · ${usage.total_sessions||0} 会话</div>
    </div>

    <div class="card">
      <h3>📈 7日趋势</h3>
      ${(usage.daily||[]).map(d => `
        <div class="trend-row">
          <span class="trend-date">${d.date.slice(5)}</span>
          <div class="trend-bar-wrap"><div class="trend-bar" style="width:${Math.max(3,(d.tokens/(usage.total_tokens||1))*100)}%;background:${emp.color}"></div></div>
          <span class="trend-val">${(d.tokens/1000).toFixed(0)}K</span>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>👥 Anima 团队</h3>
      ${['deepseek-executor','qwen-writer','kimi-reader','claude-critic'].map((w,i) => `
        <div class="worker-row">
          <span class="worker-name"><span class="worker-dot ${i===0?'busy':'online'}"></span>${w}</span>
          <span class="worker-status">${i===0?'执行中':'空闲'}</span>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>⚡ 操作</h3>
      <button class="quick-btn" onclick="window.open('http://127.0.0.1:9119')">📊 Anima Dashboard</button>
      <button class="quick-btn" onclick="window.open('http://127.0.0.1:9119/kanban')">📋 Kanban</button>
      <button class="quick-btn" onclick="refresh()">🔄 刷新数据</button>
    </div>
  `;
}

refresh();
</script>
</body>
</html>
