name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Node ──
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Rust ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux 系统依赖 ──
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Python 后端打包为 sidecar ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller

      - name: Build Python sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-x86_64-pc-windows-msvc --hidden-import analyst_worker --hidden-import pm_worker --hidden-import researcher_worker websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-x86_64-pc-windows-msvc.exe ../src-tauri/binaries/

      - name: Build Python sidecar (macOS arm64)
        if: matrix.label == 'macos-arm64'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-aarch64-apple-darwin --hidden-import analyst_worker --hidden-import pm_worker --hidden-import researcher_worker websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-aarch64-apple-darwin ../src-tauri/binaries/

      - name: Build Python sidecar (macOS x64)
        if: matrix.label == 'macos-x64'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-x86_64-apple-darwin --hidden-import analyst_worker --hidden-import pm_worker --hidden-import researcher_worker websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-x86_64-apple-darwin ../src-tauri/binaries/

      - name: Build Python sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-x86_64-unknown-linux-gnu --hidden-import analyst_worker --hidden-import pm_worker --hidden-import researcher_worker websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-x86_64-unknown-linux-gnu ../src-tauri/binaries/

      # ── 前端依赖 ──
      - name: Install frontend deps
        run: npm install

      # ── Tauri 构建 ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          appId: com.anima.app
          tagName: ${{ github.ref_name }}
          releaseName: 'Anima ${{ github.ref_name }}'
          releaseBody: |
            ## Anima ${{ github.ref_name }}

            本地 AI 工作台 · 全功能桌面版

            ### 下载
            - **Windows**: `Anima_*_x64-setup.exe`
            - **macOS (Apple Silicon)**: `Anima_*_aarch64.dmg`
            - **macOS (Intel)**: `Anima_*_x64.dmg`
            - **Linux**: `anima_*_amd64.AppImage`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # ── tauri-action 不上传 .sig，手动补 ──
      # tauri-action 完成后 sig 文件仍在 target/*/release/bundle/ 下，
      # 但 find 在某些 runner 上会因 shell 环境差异搜不到。
      # 改用 glob 直接指定路径，更可靠。
      - name: Upload updater signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          TARGET=${{ matrix.target }}
          BUNDLE_DIR="src-tauri/target/${TARGET}/release/bundle"
          echo "=== Looking for .sig files in ${BUNDLE_DIR} ==="
          ls -laR "${BUNDLE_DIR}" 2>/dev/null | grep '\.sig' || echo "(no sig via ls)"
          # 上传所有 .sig 文件（nsis/*.sig + msi/*.sig 等）
          uploaded=0
          for f in "${BUNDLE_DIR}"/**/*.sig "${BUNDLE_DIR}"/*/*.sig; do
            [ -f "$f" ] || continue
            echo "Uploading: $f"
            gh release upload "${TAG}" "$f" --repo chengshi0213-gif/Anima --clobber && uploaded=$((uploaded+1)) || echo "WARN: failed $f"
          done
          echo "=== Uploaded ${uploaded} sig file(s) ==="

  # ── 构建完成后：把安装包 + update.json 发布到 anima-site（公开仓库）──
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout anima-site
        uses: actions/checkout@v4
        with:
          repository: chengshi0213-gif/anima-site
          token: ${{ secrets.RELEASE_TOKEN }}
          path: anima-site

      - name: Download Anima release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          mkdir -p assets
          gh release download ${TAG} --repo chengshi0213-gif/Anima --dir ./assets/ \
            --pattern "Anima_*" --pattern "*.sig" \
            --pattern "*.AppImage" --pattern "*.deb" --pattern "*.rpm" --pattern "*.msi" || true
          ls -la ./assets/

      - name: Publish installers to anima-site release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          gh release view ${TAG} --repo chengshi0213-gif/anima-site >/dev/null 2>&1 || \
            gh release create ${TAG} --repo chengshi0213-gif/anima-site \
              --title "Anima ${TAG}" --notes "Anima ${TAG} — 本地优先 AI 伙伴"
          gh release upload ${TAG} --repo chengshi0213-gif/anima-site ./assets/* --clobber

      - name: Generate update.json
        run: |
          TAG=${{ github.ref_name }}
          WIN_SIG=$(cat ./assets/*x64-setup.exe.sig 2>/dev/null || echo "")
          MAC_ARM_SIG=$(cat ./assets/*aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          MAC_X64_SIG=$(cat ./assets/*x64.app.tar.gz.sig 2>/dev/null || echo "")
          VERSION=${TAG#v}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/chengshi0213-gif/anima-site/releases/download/${TAG}"
          cat > anima-site/update.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Anima ${TAG} — 本地优先 AI 伙伴",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE}/Anima_${VERSION}_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "${BASE}/Anima_aarch64.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${BASE}/Anima_x64.app.tar.gz"
              }
            }
          }
          EOF
          cat anima-site/update.json

      - name: Push update.json to anima-site
        run: |
          cd anima-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --staged --quiet || git commit -m "chore: update manifest ${GITHUB_REF_NAME}"
          git push
