name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Node ──
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Rust ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux 系统依赖 ──
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── Python 后端打包为 sidecar ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          cd backend
          pip install -r requirements.txt pyinstaller

      - name: Build Python sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-x86_64-pc-windows-msvc websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-x86_64-pc-windows-msvc.exe ../src-tauri/binaries/

      - name: Build Python sidecar (macOS arm64)
        if: matrix.label == 'macos-arm64'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-aarch64-apple-darwin websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-aarch64-apple-darwin ../src-tauri/binaries/

      - name: Build Python sidecar (macOS x64)
        if: matrix.label == 'macos-x64'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-x86_64-apple-darwin websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-x86_64-apple-darwin ../src-tauri/binaries/

      - name: Build Python sidecar (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cd backend
          pyinstaller --onefile --name anima-server-x86_64-unknown-linux-gnu websocket_server.py
          mkdir -p ../src-tauri/binaries
          cp dist/anima-server-x86_64-unknown-linux-gnu ../src-tauri/binaries/

      # ── 前端依赖 ──
      - name: Install frontend deps
        run: npm install

      # ── Tauri 构建 ──
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Anima ${{ github.ref_name }}'
          releaseBody: |
            ## Anima ${{ github.ref_name }}

            本地 AI 工作台 · 全功能桌面版

            ### 下载
            - **Windows**: `Anima_*_x64-setup.exe`
            - **macOS (Apple Silicon)**: `Anima_*_aarch64.dmg`
            - **macOS (Intel)**: `Anima_*_x64.dmg`
            - **Linux**: `anima_*_amd64.AppImage`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── 构建完成后更新 anima-site 的 update.json（updater manifest）──
  publish-update-manifest:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout anima-site
        uses: actions/checkout@v4
        with:
          repository: chengshi0213-gif/anima-site
          token: ${{ secrets.GITHUB_TOKEN }}
          path: anima-site

      - name: Get release info
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          # 获取 .sig 签名（Windows）
          WIN_SIG=$(gh release view ${TAG} --repo chengshi0213-gif/Anima --json assets -q '.assets[] | select(.name | endswith("x64-setup.exe.sig")) | .url' | head -1)
          MAC_ARM_SIG=$(gh release view ${TAG} --repo chengshi0213-gif/Anima --json assets -q '.assets[] | select(.name | endswith("aarch64.app.tar.gz.sig")) | .url' | head -1)
          MAC_X64_SIG=$(gh release view ${TAG} --repo chengshi0213-gif/Anima --json assets -q '.assets[] | select(.name | endswith("x64.app.tar.gz.sig")) | .url' | head -1)
          echo "win_sig=${WIN_SIG}" >> $GITHUB_OUTPUT
          echo "mac_arm_sig=${MAC_ARM_SIG}" >> $GITHUB_OUTPUT
          echo "mac_x64_sig=${MAC_X64_SIG}" >> $GITHUB_OUTPUT

      - name: Download signatures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          gh release download ${TAG} --repo chengshi0213-gif/Anima --pattern "*.sig" --dir ./sigs/ 2>/dev/null || true
          ls ./sigs/ || echo "no sigs"

      - name: Generate update.json
        run: |
          TAG=${{ github.ref_name }}
          # 读取签名内容
          WIN_SIG=$(cat ./sigs/*x64-setup.exe.sig 2>/dev/null || echo "")
          MAC_ARM_SIG=$(cat ./sigs/*aarch64.app.tar.gz.sig 2>/dev/null || echo "")
          MAC_X64_SIG=$(cat ./sigs/*x64.app.tar.gz.sig 2>/dev/null || echo "")
          # 版本号去掉 v 前缀
          VERSION=${TAG#v}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > anima-site/update.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Anima ${TAG} — 本地优先 AI 伙伴",
            "pub_date": "${DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "https://github.com/chengshi0213-gif/anima-site/releases/download/v1.1.0/Anima_1.1.0_x64-setup.exe"
              },
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "https://github.com/chengshi0213-gif/anima-site/releases/download/v1.1.0/Anima_1.1.0_aarch64.dmg"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "https://github.com/chengshi0213-gif/anima-site/releases/download/v1.1.0/Anima_1.1.0_x64.dmg"
              }
            }
          }
          EOF

      - name: Push update.json to anima-site
        run: |
          cd anima-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --staged --quiet || git commit -m "chore: update manifest ${GITHUB_REF_NAME}"
          git push
