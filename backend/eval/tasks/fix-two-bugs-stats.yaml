id: fix-two-bugs-stats
title: summarize 里有两个独立 bug
category: bug-fix
prompt: |
  stats.py 的 summarize(nums) 应返回 {"count", "mean", "median"}。
  test_stats.py 现在是红的——里面不止一处错。请改 stats.py 让所有测试通过，不要改测试文件。
  提示：跑一遍测试看清到底有几处失败，全修好再收工。
verify: "{py} -m pytest -q"
timeout: 120
setup:
  files:
    stats.py: |
      def summarize(nums):
          s = sorted(nums)
          n = len(s)
          # bug1: 用整除截断了小数
          mean = sum(s) // n
          mid = n // 2
          if n % 2 == 1:
              median = s[mid]
          else:
              # bug2: 偶数长度应取中间两数的平均，这里只取了较小的一个
              median = s[mid - 1]
          return {"count": n, "mean": mean, "median": median}
    test_stats.py: |
      from stats import summarize

      def test_count():
          assert summarize([1, 2, 3, 4])["count"] == 4

      def test_mean_keeps_fraction():
          assert summarize([1, 2, 3, 4])["mean"] == 2.5

      def test_mean_integer_case():
          assert summarize([2, 4, 6])["mean"] == 4

      def test_median_even_is_average():
          assert summarize([1, 2, 3, 4])["median"] == 2.5

      def test_median_odd():
          assert summarize([5, 1, 3])["median"] == 3
solution:
  files:
    stats.py: |
      def summarize(nums):
          s = sorted(nums)
          n = len(s)
          mean = sum(s) / n
          mid = n // 2
          if n % 2 == 1:
              median = s[mid]
          else:
              median = (s[mid - 1] + s[mid]) / 2
          return {"count": n, "mean": mean, "median": median}
