# Anima — 配置文件
# 首次安装后，Onboarding 向导会自动填写此文件
# 也可以手动编辑（位于 ~/.anima/config.yaml）

# ── API Keys ──
api:
  deepseek_key:  ""      # DeepSeek（Anima / 陶朱）https://platform.deepseek.com
  kimi_key:      ""      # Kimi（陶朱子 Agent 写手/阅读者）https://platform.moonshot.cn
  qwen_key:      ""      # 通义千问（知识库 Embedding）https://dashscope.aliyun.com
  openai_key:    ""      # OpenAI（可选）https://platform.openai.com
  anthropic_key: ""      # Anthropic Claude（可选）

# ── 端口配置 ──
port:
  ws: 9100   # WebSocket/HTTP 主服务

# ── 语言 ──
lang: "zh"   # zh | en

# ── 数据目录 ──
# 留空则自动使用 ~/.anima/data
# data_dir: "/custom/path/to/data"

# ── 工作区 ──
# Agent 执行代码操作的目录
# workspace: "~/anima-workspace"

# ── MCP 外部工具（Model Context Protocol，M11）──
# 一个协议接入无限外部工具，无需手写集成。默认无 server（功能关闭）。
# 安全：只有 enabled=true 且你显式配置的 server 才会启动；stdio server 会运行命令，
#       启用前请确认命令可信。env 可用 ${api.xxx} 复用上面的 Key，无需重复填写。
# 需要安装 SDK：pip install "mcp>=1.0"（未安装则自动跳过，不影响其它功能）
# mcp:
#   servers:
#     - name: github
#       transport: stdio
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-github"]
#       env: { GITHUB_TOKEN: "${api.github_token}" }   # 复用已配置的 token
#       enabled: false
#     - name: filesystem
#       transport: stdio
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-filesystem", "~/anima-workspace"]
#       enabled: false
#     - name: remote_example
#       transport: sse
#       url: "http://localhost:3001/sse"
#       enabled: false

# ── 安全：危险操作确认 + 工具钩子（M14 内核3）──
# 默认全关——机制就位但不打扰。需要时再 opt-in 打开。
# confirm 策略值：off(默认放行) | ask(问你) | allow(永远放行) | deny(永远拒)。
#   ask 时危险工具会弹确认卡片；"本次会话允许 / 永久允许" 由卡片选择。
#   无人值守（子员工 / 定时任务 / 无界面）默认拒 ask 类；可设 unattended: allow 放开。
# hooks：在每次工具调用前后插自定义动作。python 形态 "模块:函数"（返回
#   {"block":"原因"} 可在 pre_tool 否决工具）；shell 形态把 payload 以 JSON 喂 stdin。
# security:
#   confirm:
#     shell: ask                      # 执行 shell 命令前确认
#     write_outside_workspace: ask    # 写工作区以外的文件前确认
#     git_push: ask
#     mcp_destructive: ask            # 名字含 delete/remove/drop... 的 MCP 工具
#     unattended: deny                # 无活动界面时 ask 类如何处置
#   hooks:
#     pre_tool:
#       - {match: file_write, python: "myhooks:guard_sensitive_path"}
#     post_tool:
#       - {match: file_write, shell: "echo formatted"}   # 钩子自行解析 stdin 的 JSON payload
